
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peppers Database</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Pepper Database</h1>
        <p>Explore the pepper database.</p>
    </header>
    
    
    <main>
        <aside id="pepper-sidebar">
            <div class="sidebar-header">
                <h2>All Peppers</h2>
                <button id="hide-list">Hide List</button>
            </div>
            <div id="pepper-list"></div>
        </aside>
        
        <section id="pepper-details">
            <p>Select a pepper to view its information.</p>
        </section>
        
        <select id="sort-parameter">
            <option value="name">Name</option>
            <option value="shu_min">Minimum SHU</option>
            <option value="shu_max">Maximum SHU</option>
            <option value="days_to_harvest">Harvest Time</option>
            <option value="length_max">Maximum Length</option>
        </select>
        
        <select id="sort-order">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
        </select>
    </main>
    
    <script src="peppers.js"></script>
</body>
</html>
