<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore candies with the Candy API.">
    <title>Candy Database</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Candy Database</h1>
        <p>Explore candies from around the world.</p>
    </header>

    <main>
        <aside>
            <div class="list-header">
                <h2>Candy List</h2>
                <button id="hide-list">Hide List</button>
            </div>

            <div id="candy-list"></div>
        </aside>

        <section>
            <div id="candy-details">
                <h2>Select a Candy</h2>
                <p>Choose a candy from the list to view its information.</p>
            </div>
        </section>
    </main>

    <script src="candy.js"></script>
</body>
</html>
